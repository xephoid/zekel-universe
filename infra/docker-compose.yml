# Local dev and test stack for Zekel Universe.
#
# The engine image builds from a sibling checkout of the zekel engine repo,
# so clone both repos side by side:
#
#   code/
#     zekel/           <- https://github.com/... the engine
#     zekel-universe/  <- this repo
#
# Then, from this repo root:
#
#   cp .env.example .env   # fill in values
#   docker compose -f infra/docker-compose.yml up

services:
  engine:
    build:
      context: ../zekel
      dockerfile: ../zekel-universe/infra/engine.Dockerfile
    environment:
      MCP_TRANSPORT: http
      PORT: 8787
      MCP_BEARER_TOKEN: ${ENGINE_TOKEN:?Set ENGINE_TOKEN in .env}
      SESSION_STORE: sqlite
      SESSION_DB_PATH: /data/sessions.db
    volumes:
      - engine-sessions:/data
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8787/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  server:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    environment:
      PORT: 8788
      ENGINE_URL: http://engine:8787/mcp
      ENGINE_TOKEN: ${ENGINE_TOKEN:?Set ENGINE_TOKEN in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: sqlite:/data/dev.db
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
    volumes:
      - server-data:/data
    ports:
      - "8788:8788"
    depends_on:
      engine:
        condition: service_healthy

  # Production will move the server off SQLite and onto Postgres.
  # Uncomment when the production profile lands:
  #
  # postgres:
  #   image: postgres:16-alpine
  #   profiles: ["production"]
  #   environment:
  #     POSTGRES_DB: universe
  #     POSTGRES_USER: universe
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #
  # and point the server at it with:
  #   DATABASE_URL: postgres://universe:${POSTGRES_PASSWORD}@postgres:5432/universe

volumes:
  engine-sessions:
  server-data:
  # pg-data:
