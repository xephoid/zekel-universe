<style>
body{margin:0;background:#0d1124}
a{color:#FFD700}a:hover{color:#fff1a8}
.void{background-color:#0d1124;background-image:radial-gradient(rgba(232,228,216,.16) 1px,transparent 1.4px);background-size:24px 24px}
.ic{display:inline-block;flex:none;background-color:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.i-ship{-webkit-mask-image:url(assets/icons/spaceship.png);mask-image:url(assets/icons/spaceship.png)}
.i-swirl{-webkit-mask-image:url(assets/icons/star-swirl.png);mask-image:url(assets/icons/star-swirl.png)}
.i-meteor{-webkit-mask-image:url(assets/icons/burning-meteor.png);mask-image:url(assets/icons/burning-meteor.png)}
.i-credits{-webkit-mask-image:url(assets/icons/credits-currency.png);mask-image:url(assets/icons/credits-currency.png)}
.i-drink{-webkit-mask-image:url(assets/icons/drink-me.png);mask-image:url(assets/icons/drink-me.png)}
.i-idcard{-webkit-mask-image:url(assets/icons/id-card.png);mask-image:url(assets/icons/id-card.png)}
.i-rocket{-webkit-mask-image:url(assets/icons/rocket-flight.png);mask-image:url(assets/icons/rocket-flight.png)}
.i-skills{-webkit-mask-image:url(assets/icons/skills.png);mask-image:url(assets/icons/skills.png)}
.i-world{-webkit-mask-image:url(assets/icons/world.png);mask-image:url(assets/icons/world.png)}
.i-meteorimpact{-webkit-mask-image:url(assets/icons/meteor-impact.svg);mask-image:url(assets/icons/meteor-impact.svg)}
.i-rays{-webkit-mask-image:url(assets/icons/explosion-rays.svg);mask-image:url(assets/icons/explosion-rays.svg)}
.i-crack{-webkit-mask-image:url(assets/icons/cracked-glass.png);mask-image:url(assets/icons/cracked-glass.png)}
.i-suit{-webkit-mask-image:url(assets/icons/space-suit.svg);mask-image:url(assets/icons/space-suit.svg)}
.i-pirate{-webkit-mask-image:url(assets/icons/pirate-flag.png);mask-image:url(assets/icons/pirate-flag.png)}
.lbl{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:11px;letter-spacing:.16em}
.num{font-family:'IBM Plex Mono',monospace;font-weight:600}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;flex:1;border:none;background:transparent;color:#9aa3c7;font:inherit;font-size:11px;cursor:pointer}
.ga{filter:grayscale(1) invert(1) contrast(1.45) sepia(1) saturate(3) hue-rotate(8deg) brightness(1.08);background:#170d02;-webkit-mask-image:repeating-linear-gradient(0deg,#000 0 2px,rgba(0,0,0,.55) 2px 3px);mask-image:repeating-linear-gradient(0deg,#000 0 2px,rgba(0,0,0,.55) 2px 3px)}
.gx{display:inline-grid;flex:none;vertical-align:middle}
.gx>.ic{grid-area:1/1}
.gx>.gh{background-color:#ff4f7b!important;opacity:.55;transform:translate(2px,0);animation:gxjit 2.7s steps(1) infinite}
.gx>.ic:not(.gh){animation:gxjit 3.4s steps(1) infinite reverse}
.gx:nth-child(2n)>.gh{animation-duration:3.1s}.gx:nth-child(3n)>.gh{animation-duration:2.3s}
@keyframes gxjit{0%,100%{transform:translate(0,0)}18%{transform:translate(-2px,0)}19%{transform:translate(2px,0)}20%{transform:translate(0,0)}66%{transform:translate(2px,0)}67%{transform:translate(0,0)}}
.gxi{display:inline-grid;flex:none;vertical-align:middle;position:relative}
.gxi>img{grid-area:1/1}
.gxi>.gh{opacity:.6;transform:translate(3px,0);animation:gxjit 2.9s steps(1) infinite}
.gxi>.ga.gh{filter:grayscale(1) invert(1) contrast(1.45) sepia(1) saturate(5) hue-rotate(290deg) brightness(1.05)}
.gxi>.ga-red.gh{filter:grayscale(1) invert(1) contrast(1.45) sepia(1) saturate(5) hue-rotate(150deg) brightness(1.05)}
.gxi>img:not(.gh){mix-blend-mode:screen;animation:gxjit 3.7s steps(1) infinite reverse}
.gxi:nth-child(2n)>.gh{animation-duration:3.3s}.gxi:nth-child(3n)>.gh{animation-duration:2.4s}
</style>
</helmet>
<div class="void" style="width: 390px; height: 844px; box-sizing: border-box; color: #e8e4d8; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">

      <span style="display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 999px; border: 1px solid #4a5384; font-size: 12px"><span class="gx"><span class="ic i-idcard gh" style="width: 14px; height: 14px; color: #FFD700"></span><span class="ic i-idcard" style="width: 14px; height: 14px; color: #FFD700"></span></span>Out · ♣2 Channel clash <span class="num">2/3</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span class="gx"><span class="ic i-ship gh" style="width: 18px; height: 18px; color: #b9bdd4"></span><span class="ic i-ship" style="width: 18px; height: 18px; color: #b9bdd4"></span></span>
      <div style="flex: 1"><div style="display: flex; align-items: center; gap: 6px"><span title="Ship lost" style="width: 18px; height: 18px; flex: none; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed #f07070; display: flex; align-items: center; justify-content: center; color: #ff7a7f"><span class="gx"><span class="ic i-rays gh" style="width: 10px; height: 10px"></span><span class="ic i-rays" style="width: 10px; height: 10px"></span></span></span><div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px"><span style="display: flex; filter: drop-shadow(0 0 6px rgba(242,181,68,.6))"><span style="flex: 1; height: 18px; background: #f2b544; clip-path: polygon(14% 0, 100% 0, 86% 50%, 100% 100%, 14% 100%, 0 50%)"></span></span><span style="display: flex; filter: drop-shadow(0 0 6px rgba(242,181,68,.6))"><span style="flex: 1; height: 18px; background: #f2b544; clip-path: polygon(14% 0, 100% 0, 86% 50%, 100% 100%, 14% 100%, 0 50%)"></span></span><span style="height: 18px; background: #262e5c; clip-path: polygon(14% 0, 100% 0, 86% 50%, 100% 100%, 14% 100%, 0 50%); display: flex; align-items: center; justify-content: center; color: #56609a"><span class="gx"><span class="ic i-crack gh" style="width: 8px; height: 8px"></span><span class="ic i-crack" style="width: 8px; height: 8px"></span></span></span><span style="height: 18px; background: #262e5c; clip-path: polygon(14% 0, 100% 0, 86% 50%, 100% 100%, 14% 100%, 0 50%); display: flex; align-items: center; justify-content: center; color: #56609a"><span class="gx"><span class="ic i-crack gh" style="width: 8px; height: 8px"></span><span class="ic i-crack" style="width: 8px; height: 8px"></span></span></span></div></div></div><span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .1em; color: #f2b544">DAMAGED</span>

        <div style="height: 22px; display: flex; align-items: center; justify-content: space-between; padding: 0 7px; background: #ad90f7; color: #10142a"><span class="lbl" style="font-size: 8px">HAZARD</span><span class="num" style="font-size: 10px">♠ A</span></div>

        <span style="padding: 0 8px 9px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 14px; line-height: 1.1">Meteor shower</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <button style="text-align: left; font: inherit; color: #ece8dc; background: #1f2650; border: 3px solid #FFD700; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; cursor: pointer">

        </button>

    </div>

    <section aria-label="Roll" style="margin-top: auto; background: #1a2042; border: 1.5px solid #343d6b; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">

      <button style="height: 56px; border-radius: 14px; border: none; background: #FFD700; color: #1d1d20; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.06em; cursor: pointer">ROLL</button>

      <div style="display: flex; flex-direction: column; gap: 4px">

        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <span style="position: relative; display: flex"><span class="gxi"><img class="ga gh" src="assets/portraits/hexapod.jpg" alt="" aria-hidden="true" style="object-fit: cover; width: 36px; height: 36px; border-radius: 50%; border: 2px solid #e8b64a"><img class="ga" src="assets/portraits/hexapod.jpg" alt="7EE700, no anger" style="object-fit: cover; width: 36px; height: 36px; border-radius: 50%; border: 2px solid #e8b64a"></span></span>
        <span style="position: relative; display: flex"><span class="gxi"><img class="ga gh" src="assets/portraits/grull.jpg" alt="" aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #e8b64a; object-fit: cover"><img class="ga" src="assets/portraits/grull.jpg" alt="Slate, anger 1" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #e8b64a; object-fit: cover"></span><span style="position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; background: #b3232a; border: 2px solid #0d1124"></span></span>
