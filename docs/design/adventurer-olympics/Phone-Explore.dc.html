<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventurer Olympics on a phone, exploring</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2b2233}a:hover{color:#e0762b}
@keyframes aop-flip{0%{transform:translate(-150px,-240px) rotateY(180deg) scale(.5);opacity:0}40%{opacity:1}100%{transform:translate(0,0) rotateY(0) scale(1);opacity:1}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#fbf3e0;color:#2b2233;font-family:'Fredoka',sans-serif" data-screen-label="Phone, exploring">

  <div style="height:54px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:#fff7e6;border-bottom:3px solid #2b2233">
    <span style="flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Adventurer Olympics</span>
    <span style="flex:none;padding:2px 8px;border-radius:8px;background:#f3e6c8;border:2px solid #2b2233;font-size:13px;font-weight:700">R7</span>
    <span style="flex:none;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:#ffe0cc;color:#7a2e12;border:2.5px solid #2b2233;font-size:13px;font-weight:700;white-space:nowrap"><span style="width:10px;height:10px;border-radius:50%;background:#e8483d;border:2px solid #2b2233"></span>{{ pillText }}</span>
    <a href="Phone-Menu.dc.html" aria-label="Menu: undo, rules, settings, last move, log" style="flex:none;width:44px;height:44px;box-sizing:border-box;display:grid;place-items:center;border-radius:11px;border:2.5px solid #2b2233;background:#fff7e6;text-decoration:none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 6h16M3 11h16M3 16h16" stroke="#2b2233" stroke-width="2.8" stroke-linecap="round"></path></svg></a>
  </div>

  <div style="height:46px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 10px;background:#fbf3e0;border-bottom:3px solid #2b2233">
    <sc-for list="{{ decks }}" as="d" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;gap:4px">
        <div style="width:24px;height:32px;box-sizing:border-box;border-radius:5px;background:{{ d.color }};border:2px solid #2b2233;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(43,34,51,.18)">
          <dc-import name="AO-Icon" icon="{{ d.icon }}" size="20" hint-size="20px,20px"></dc-import>
        </div>
        <span style="font-size:16px;font-weight:700">{{ d.count }}</span>
      </div>
    </sc-for>
    <div title="Map tiles still face down" style="display:flex;align-items:center;gap:4px;padding:2px 6px 2px 2px;border-radius:9px;background:{{ stackBg }};border:2px solid {{ stackBorder }}">
      <div style="width:28px;height:24px;background:#2b2233;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);position:relative"><span style="position:absolute;inset:2px;background:#bfe39a;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">?</span></div>
      <span style="font-size:16px;font-weight:700">3</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:1px">
      <span style="font-size:12px;font-weight:600;color:#5c4f66;margin-right:2px">Free</span>
      <dc-import name="AO-Icon" icon="spades" size="24" hint-size="24px,24px"></dc-import>
      <dc-import name="AO-Icon" icon="star" size="24" hint-size="24px,24px"></dc-import>
    </div>
  </div>

  <div style="flex:1;min-height:0;position:relative">
    <dc-import name="Phone-Map" w="390" h="514" hex-size="24" steps="0" pos="{{ pos }}" show-slots="{{ showSlots }}" on-slot="{{ onSlot }}" pending="{{ pending }}" extra-tiles="{{ extraTiles }}" extra-tokens="{{ extraTokens }}" fresh-tok="{{ freshTok }}" pad="{{ pad }}" hint-size="390px,514px"></dc-import>
  </div>

  <div role="dialog" aria-label="Exploring, tile 8" style="height:230px;flex:none;box-sizing:border-box;padding:8px 14px 14px;background:#fff7e6;border-top:3px solid #2b2233;border-radius:20px 20px 0 0;box-shadow:0 -5px 0 rgba(43,34,51,.16);display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:center"><span style="width:44px;height:5px;border-radius:3px;background:rgba(43,34,51,.25)"></span></div>
    <div style="display:flex;gap:12px;align-items:center">
      <div style="position:relative;width:96px;height:96px;flex:none;animation:{{ flipAnim }}">
        <sc-for list="{{ mini }}" as="m" hint-placeholder-count="7">
          <div style="position:absolute;left:{{ m.x }}px;top:{{ m.y }}px;width:36px;height:31px;background:#2b2233;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)">
            <span style="position:absolute;inset:1.5px;background:#d2eaa8;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:flex;align-items:center;justify-content:center">
              <sc-if value="{{ m.has }}" hint-placeholder-val="{{ false }}"><dc-import name="AO-Icon" icon="{{ m.icon }}" size="24" hint-size="24px,24px"></dc-import></sc-if>
            </span>
          </div>
        </sc-for>
      </div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
        <div style="font-size:21px;font-weight:700">{{ title }}</div>
        <div style="font-size:16px;line-height:1.35">{{ text }}</div>
        <sc-if value="{{ turning }}" hint-placeholder-val="{{ false }}">
          <div aria-label="Which way it faces, of six" style="display:flex;gap:5px;margin-top:2px">
            <sc-for list="{{ dots }}" as="d" hint-placeholder-count="6"><span style="width:11px;height:11px;box-sizing:border-box;border-radius:50%;background:{{ d.bg }};border:2px solid #2b2233"></span></sc-for>
          </div>
        </sc-if>
      </div>
    </div>
    <sc-if value="{{ turning }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:8px;margin-top:auto">
        <button type="button" onClick="{{ left }}" aria-label="Turn the tile left" style="flex:1;height:50px;border-radius:13px;border:2.5px solid #2b2233;background:#fff7e6;color:#2b2233;font:700 15px 'Fredoka',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 4v5h5M4.6 9A8 8 0 1 1 5 15.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Left</button>
        <button type="button" onClick="{{ right }}" aria-label="Turn the tile right" style="flex:1;height:50px;border-radius:13px;border:2.5px solid #2b2233;background:#fff7e6;color:#2b2233;font:700 15px 'Fredoka',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px">Right<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 4v5h-5M19.4 9A8 8 0 1 0 19 15.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button type="button" onClick="{{ place }}" style="flex:1.3;height:50px;border-radius:13px;border:3px solid #2b2233;background:#ff8a3d;color:#2b2233;font:700 17px 'Fredoka',sans-serif;cursor:pointer;box-shadow:3px 4px 0 rgba(43,34,51,.16)">Place tile</button>
      </div>
    </sc-if>
    <sc-if value="{{ picking }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:auto;padding:10px 12px;border-radius:12px;background:#ffe0cc;border:2px dashed #ff8a3d;font-size:15px;font-weight:600;color:#7a2e12;text-align:center">Tap one of the two glowing slots on the map</div>
    </sc-if>
    <sc-if value="{{ placed }}" hint-placeholder-val="{{ false }}">
      <a href="Phone-Table.dc.html" style="margin-top:auto;height:50px;box-sizing:border-box;border-radius:13px;border:3px solid #2b2233;background:#ff8a3d;color:#2b2233;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:3px 4px 0 rgba(43,34,51,.16)">End turn</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["slot","turn","placed"],"default":"slot"},"$preview":{"width":390,"height":844}}'>
// Exploring on a phone. You walked to the edge with a step left and pressed Explore:
// tile 8 has flipped over into the sheet, and the two empty slots that touch your hex
// glow on the map. Tap one: the tile drops in, and the sheet gives you Left, Right and
// Place. The sheet is short on purpose, so the map, the slot and the tile stay in view.
const R3 = Math.sqrt(3);
const DIRS = [[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
const DN = ['N','NE','SE','S','SW','NW'];
const TILE8 = {NW:'little', N:'spades', NE:'dungeon'};
class Component extends DCLogic {
  constructor(p){ super(p); this.state = {stage:null, pick:null, k:null}; }
  stage(){ return this.state.stage || this.props.stage || 'slot'; }
  renderVals(){
    const st = this.stage();
    const pick = this.state.pick || (st === 'slot' ? null : [-1,5]);
    const k = this.state.k === null ? (st === 'slot' ? 0 : 1) : this.state.k;
    const ms = 17;
    const mini = [[0,0]].concat(DIRS).map((d, j)=>{
      const pd = j === 0 ? -1 : (j - 1 - k + 6) % 6, icon = pd < 0 ? null : TILE8[DN[pd]];
      const x = 1.5 * ms * d[0], y = R3 * ms * (d[1] + d[0] / 2);
      return {x:+(48 + x - 18).toFixed(1), y:+(48 + y - 15.5).toFixed(1), has:!!icon, icon:icon || 'city'};
    });
    const placed = st === 'placed';
    const tile = pick ? {n:8, c:pick, k:k} : null;
    return {
      pillText:placed ? 'Turn over' : 'Your turn',
      decks:[{icon:'cha', color:'#5aa9e6', count:13}, {icon:'dungeon', color:'#9d8fc2', count:24}, {icon:'little', color:'#8fd14f', count:8}, {icon:'big', color:'#ff7a59', count:12}],
      stackBg:st === 'slot' ? '#ffe0cc' : 'transparent', stackBorder:st === 'slot' ? '#ff8a3d' : 'transparent',
      pos:{red:[0,3]}, pad:{top:0, bottom:st === 'slot' ? 104 : 0},
      showSlots:st === 'slot', onSlot:(c)=> this.setState({stage:'turn', pick:c, k:0}),
      pending:placed ? null : (st === 'turn' ? tile : null),
      extraTiles:placed && tile ? [tile] : [], extraTokens:placed && tile ? [{h:tile.c[0] + ',' + tile.c[1], p:'red'}] : [],
      freshTok:placed && tile ? tile.c[0] + ',' + tile.c[1] : '',
      flipAnim:st === 'slot' ? 'aop-flip .55s cubic-bezier(.2,.8,.2,1) both' : 'none',
      mini:mini, turning:st === 'turn', picking:st === 'slot', placed:placed,
      title:placed ? 'Tile 8 is down' : 'Exploring · tile 8',
      text:st === 'slot' ? 'Pick where it goes. You can only use a slot that touches your hex.' : st === 'turn' ? 'Turn it any of 6 ways. The icons turn with it.' : 'Your coin is on its centre. Exploring used your last step, so your turn is over.',
      dots:[0,1,2,3,4,5].map((i)=> ({bg:i === k ? '#ff8a3d' : 'transparent'})),
      left:()=> this.setState({stage:'turn', pick:pick, k:(k + 5) % 6}), right:()=> this.setState({stage:'turn', pick:pick, k:(k + 1) % 6}),
      place:()=> this.setState({stage:'placed', pick:pick, k:k})
    };
  }
}
</script>
</body>
</html>
