<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventurer Olympics on a phone, your turn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2b2233}a:hover{color:#e0762b}
@keyframes aop-rise{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes aop-caption{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#fbf3e0;color:#2b2233;font-family:'Fredoka',sans-serif" data-screen-label="Phone table, your turn">

  <!-- top bar: one line -->
  <div style="height:54px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:#fff7e6;border-bottom:3px solid #2b2233">
    <span style="flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Adventurer Olympics</span>
    <span style="flex:none;padding:2px 8px;border-radius:8px;background:#f3e6c8;border:2px solid #2b2233;font-size:13px;font-weight:700">R7</span>
    <span style="flex:none;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:{{ pill.bg }};color:{{ pill.fg }};border:2.5px solid #2b2233;font-size:13px;font-weight:700;white-space:nowrap"><span style="width:10px;height:10px;border-radius:50%;background:{{ pill.dot }};border:2px solid #2b2233"></span>{{ pill.text }}</span>
    <a href="Phone-Menu.dc.html" aria-label="Menu: undo, rules, settings, last move, log" style="flex:none;width:44px;height:44px;box-sizing:border-box;display:grid;place-items:center;border-radius:11px;border:2.5px solid #2b2233;background:#fff7e6;text-decoration:none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 6h16M3 11h16M3 16h16" stroke="#2b2233" stroke-width="2.8" stroke-linecap="round"></path></svg></a>
  </div>

  <!-- decks: where cards fly from -->
  <div style="height:46px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 10px;background:#fbf3e0;border-bottom:3px solid #2b2233">
    <sc-for list="{{ decks }}" as="d" hint-placeholder-count="4">
      <div title="{{ d.title }}" style="display:flex;align-items:center;gap:4px">
        <div style="width:24px;height:32px;box-sizing:border-box;border-radius:5px;background:{{ d.color }};border:2px solid #2b2233;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(43,34,51,.18)">
          <dc-import name="AO-Icon" icon="{{ d.icon }}" size="20" hint-size="20px,20px"></dc-import>
        </div>
        <span style="font-size:16px;font-weight:700">{{ d.count }}</span>
      </div>
    </sc-for>
    <div title="Map tiles still face down" style="display:flex;align-items:center;gap:4px">
      <div style="width:28px;height:24px;background:#2b2233;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);position:relative"><span style="position:absolute;inset:2px;background:#bfe39a;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">?</span></div>
      <span style="font-size:16px;font-weight:700">4</span>
    </div>
    <div title="Runes still free: Spade and Star" style="margin-left:auto;display:flex;align-items:center;gap:1px">
      <span style="font-size:12px;font-weight:600;color:#5c4f66;margin-right:2px">Free</span>
      <dc-import name="AO-Icon" icon="spades" size="24" hint-size="24px,24px"></dc-import>
      <dc-import name="AO-Icon" icon="star" size="24" hint-size="24px,24px"></dc-import>
    </div>
  </div>

  <!-- the map, always in view -->
  <div style="flex:1;min-height:0;position:relative">
    <dc-import name="Phone-Map" w="390" h="{{ mapH }}" hex-size="28" steps="{{ steps }}" pos="{{ pos }}" pad="{{ mapPad }}" on-hex="{{ onHex }}" hint-size="390px,613px"></dc-import>

    <button type="button" onClick="{{ toggleKey }}" aria-expanded="{{ keyOpen }}" aria-label="What the icons are" style="position:absolute;left:10px;top:10px;height:44px;padding:0 12px;border-radius:12px;border:2.5px solid #2b2233;background:#fff7e6;color:#2b2233;font:700 15px 'Fredoka',sans-serif;cursor:pointer;box-shadow:3px 4px 0 rgba(43,34,51,.16)">Key</button>
    <sc-if value="{{ keyOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:10px;top:60px;display:flex;flex-direction:column;gap:4px;padding:8px 12px 8px 8px;border-radius:14px 9px 16px 10px/10px 16px 9px 14px;background:#fff7e6;border:2.5px solid #2b2233;box-shadow:3px 4px 0 rgba(43,34,51,.16);font-size:15px;font-weight:500;animation:aop-rise .2s ease both">
        <sc-for list="{{ legend }}" as="l" hint-placeholder-count="6">
          <div style="display:flex;align-items:center;gap:8px"><dc-import name="AO-Icon" icon="{{ l.icon }}" size="26" hint-size="26px,26px"></dc-import>{{ l.name }}</div>
        </sc-for>
      </div>
    </sc-if>
    <div style="position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px">
      <button type="button" aria-label="Zoom in" style="width:44px;height:44px;border-radius:12px;border:2.5px solid #2b2233;background:#fff7e6;color:#2b2233;font:700 22px 'Fredoka',sans-serif;cursor:pointer;box-shadow:3px 4px 0 rgba(43,34,51,.16)">+</button>
      <button type="button" aria-label="Zoom out" style="width:44px;height:44px;border-radius:12px;border:2.5px solid #2b2233;background:#fff7e6;color:#2b2233;font:700 22px 'Fredoka',sans-serif;cursor:pointer;box-shadow:3px 4px 0 rgba(43,34,51,.16)">−</button>
      <button type="button" style="width:44px;height:44px;border-radius:12px;border:2.5px solid #2b2233;background:#fff7e6;color:#2b2233;font:700 14px 'Fredoka',sans-serif;cursor:pointer;box-shadow:3px 4px 0 rgba(43,34,51,.16)">Fit</button>
    </div>

    <sc-if value="{{ showHint }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:360px;box-sizing:border-box;padding:6px 14px;border-radius:999px;background:#fff7e6;border:2.5px solid #2b2233;font-size:14px;font-weight:600;text-align:center;box-shadow:3px 4px 0 rgba(43,34,51,.16)">{{ hint }}</div>
    </sc-if>

    <!-- the AI turn, as a caption over the top of the map -->
    <sc-if value="{{ ai }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:8px;right:8px;top:8px;box-sizing:border-box;padding:10px;border-radius:16px 10px 18px 12px/12px 18px 10px 16px;background:#fff7e6;border:3px solid #2b2233;box-shadow:5px 7px 0 rgba(43,34,51,.2);display:flex;flex-direction:column;gap:8px;animation:aop-caption .3s ease both">
        <div style="display:flex;align-items:center;gap:8px">
          <dc-import name="AO-Icon" icon="rogue" size="40" tint="#9b5de5" hint-size="40px,40px"></dc-import>
          <div style="flex:1;font-size:16px;line-height:1.3">Purple draws the Goat (Companion 7). It needs 2. Purple rolls 1 die: 4. The Goat joins Purple!</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <div role="group" aria-label="Playback speed" style="display:flex;gap:2px;padding:2px;border-radius:11px;background:#f3e6c8;border:2px solid #2b2233">
            <sc-for list="{{ paces }}" as="pc" hint-placeholder-count="3">
              <button type="button" onClick="{{ pc.pick }}" aria-pressed="{{ pc.on }}" style="height:40px;min-width:44px;padding:0 8px;border-radius:9px;border:0;background:{{ pc.bg }};color:#2b2233;font:600 14px 'Fredoka',sans-serif;cursor:pointer">{{ pc.label }}</button>
            </sc-for>
          </div>
          <button type="button" style="flex:1;height:44px;border-radius:11px;border:2.5px solid #2b2233;background:#fff7e6;color:#2b2233;font:600 14px 'Fredoka',sans-serif;cursor:pointer">Replay</button>
        </div>
        <button type="button" onClick="{{ backToYou }}" style="height:44px;border-radius:11px;border:2px dashed rgba(43,34,51,.4);background:transparent;color:#5c4f66;font:600 13px 'Fredoka',sans-serif;cursor:pointer">Demo only: back to your turn</button>
      </div>
    </sc-if>

    <!-- stepped onto an open icon: the test starts in a sheet -->
    <sc-if value="{{ trig }}" hint-placeholder-val="{{ false }}">
      <div role="dialog" aria-label="{{ trigTitle }}" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:8px 14px 14px;background:#fff7e6;border-top:3px solid #2b2233;border-radius:20px 20px 0 0;box-shadow:0 -5px 0 rgba(43,34,51,.16);display:flex;flex-direction:column;gap:10px;animation:aop-rise .25s ease both">
        <div style="display:flex;justify-content:center"><span style="width:44px;height:5px;border-radius:3px;background:rgba(43,34,51,.25)"></span></div>
        <div style="display:flex;align-items:center;gap:10px">
          <dc-import name="AO-Icon" icon="{{ trigIcon }}" size="44" hint-size="44px,44px"></dc-import>
          <div style="font-size:21px;font-weight:700">{{ trigTitle }}</div>
        </div>
        <div style="font-size:16px;line-height:1.4">{{ trigText }}</div>
        <a href="Phone-Test.dc.html" style="height:50px;border-radius:13px;border:3px solid #2b2233;background:#ff8a3d;color:#2b2233;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:3px 4px 0 rgba(43,34,51,.16)">{{ trigBtn }}</a>
      </div>
    </sc-if>
  </div>

  <!-- the dock: you at a glance, then this turn's buttons -->
  <div style="flex:none;box-sizing:border-box;padding:8px 10px 12px;background:#fff7e6;border-top:3px solid #2b2233;display:flex;flex-direction:column;gap:8px">
    <a href="Phone-Sheet.dc.html" aria-label="Open your adventurer, companions and quests" style="min-height:52px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:2px 10px 2px 2px;border-radius:14px;border:2.5px solid #2b2233;background:#ffe0cc;color:#2b2233;text-decoration:none">
      <dc-import name="AO-Icon" icon="fighter" size="44" tint="#e8483d" hint-size="44px,44px"></dc-import>
      <span style="font-size:16px;font-weight:700;margin-right:2px">You</span>
      <sc-for list="{{ stats }}" as="st" hint-placeholder-count="3">
        <span title="{{ st.name }}" style="display:inline-flex;align-items:center;gap:1px;padding:1px 6px 1px 2px;border-radius:999px;background:{{ st.bg }};border:2px solid #2b2233;font-size:15px;font-weight:700"><dc-import name="AO-Icon" icon="{{ st.icon }}" size="20" hint-size="20px,20px"></dc-import>{{ st.v }}</span>
      </sc-for>
      <span title="Coins left" style="display:inline-flex;align-items:center;gap:1px;font-size:15px;font-weight:700"><dc-import name="AO-Icon" icon="coin" size="18" tint="#e8483d" hint-size="18px,18px"></dc-import>4</span>
      <span title="Quest points" style="display:inline-flex;align-items:center;font-size:15px;font-weight:700"><dc-import name="AO-Icon" icon="quest" size="20" hint-size="20px,20px"></dc-import>1</span>
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="margin-left:auto;flex:none"><path d="M4 11l5-5 5 5" fill="none" stroke="#2b2233" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <div style="display:flex;align-items:center;gap:8px">
      <div title="Steps left this turn" style="flex:none;display:flex;align-items:center;gap:3px;padding-right:2px">
        <dc-import name="AO-Icon" icon="mov" size="26" hint-size="26px,26px"></dc-import>
        <sc-for list="{{ pips }}" as="sp" hint-placeholder-count="3">
          <span style="width:16px;height:16px;border-radius:50%;box-sizing:border-box;background:{{ sp.bg }};border:2.5px solid #2b2233;transition:background .2s"></span>
        </sc-for>
      </div>
      <sc-if value="{{ canExplore }}" hint-placeholder-val="{{ false }}">
        <a href="Phone-Explore.dc.html" style="flex:1;height:48px;box-sizing:border-box;border-radius:13px;border:2.5px solid #ff8a3d;background:#ffe0cc;color:#7a2e12;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">Explore</a>
      </sc-if>
      <sc-if value="{{ noExplore }}" hint-placeholder-val="{{ true }}">
        <button type="button" disabled="{{ true }}" title="{{ exploreWhy }}" style="flex:1;height:48px;border-radius:13px;border:2.5px solid rgba(43,34,51,.2);background:#f3e6c8;color:#5c4f66;font:700 16px 'Fredoka',sans-serif;cursor:not-allowed">Explore</button>
      </sc-if>
      <button type="button" onClick="{{ endTurn }}" disabled="{{ endOff }}" style="flex:1;height:48px;border-radius:13px;border:3px solid #2b2233;background:{{ endBg }};color:#2b2233;font:700 16px 'Fredoka',sans-serif;cursor:pointer;box-shadow:{{ endShadow }}">End turn</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// The table on a phone, your turn. The hex map fills the middle and never goes away;
// everything the desktop side column held is a tap away: your adventurer, companions,
// quests and the other seats in the sheet (Phone-Sheet), undo, rules, the last move
// and the log in the menu (Phone-Menu). Tap a yellow hex to step; the City next to
// you, two steps away, opens the test (Phone-Test). Moving to an edge hex lights Explore (Phone-Explore).
const DIRS = [[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
// Outer hexes that touch an empty slot in the demo map (where Explore can light up).
const EDGE = {'0,1':1,'-1,1':1,'2,-4':1,'3,-4':1,'3,-3':1,'1,-3':1,'2,1':1,'2,2':1,'1,3':1,'0,3':1,'0,2':1,'-3,0':1,'-2,1':1,'-3,2':1,'-4,2':1,'-4,1':1,'3,-2':1,'4,-2':1,'4,-1':1,'3,0':1,'-1,-3':1,'0,-3':1,'-2,-1':1,'-2,-2':1};
const NAMES = {city:'City', dungeon:'Dungeon', little:'Little Monster', big:'Big Monster'};
const TITLES = {city:'City · make a friend', dungeon:'Dungeon', little:'Little Monster · fight!', big:'Big Monster · fight!'};
const TEXT = {city:'Draw the top Companion card, then roll dice equal to your Charisma (2). Your turn ends after this.', dungeon:'Draw the top Dungeon card and do what it says. Your turn ends after this.', little:'Draw the top Little Monster card, then roll dice equal to your Strength (1). Your turn ends after this.', big:'Draw the top Big Monster card, then roll dice equal to your Strength (1). Your turn ends after this.'};
const BTN = {city:'Draw a Companion card', dungeon:'Draw a Dungeon card', little:'Draw a Little Monster card', big:'Draw a Big Monster card'};
const PACES = [['Slower',0.6],['Normal',1],['Faster',1.8]];
class Component extends DCLogic {
  constructor(p){ super(p); this.state = {pos:[1,1], steps:3, trig:null, keyOpen:false, ai:false, pace:1}; }
  onHex(k, info){
    const s = this.state; if (s.steps <= 0 || s.trig || s.ai) return;
    const q = k.split(',').map(Number);
    if (info.icon && !info.done && NAMES[info.icon]) this.setState({pos:q, steps:0, trig:info.icon});
    else this.setState({pos:q, steps:s.steps - 1});
  }
  renderVals(){
    const s = this.state, here = s.pos[0] + ',' + s.pos[1];
    const canEx = s.steps > 0 && !!EDGE[here] && !s.trig && !s.ai;
    let hint = s.steps > 0 ? 'Tap a yellow hex to step' : 'No steps left. End your turn.';
    if (canEx) hint = 'An empty slot is next to you. Explore, or keep walking.';
    const endOk = !s.trig && !s.ai;
    return {
      mapH:613, mapPad:{top:56, bottom:40}, steps:s.trig || s.ai ? 0 : s.steps, pos:{red:s.pos}, onHex:(k, info)=> this.onHex(k, info),
      pill:s.ai ? {bg:'#e3ecff', fg:'#1f3f8a', dot:'#9b5de5', text:'Purple'} : {bg:'#ffe0cc', fg:'#7a2e12', dot:'#e8483d', text:'Your turn'},
      decks:[{icon:'cha', color:'#5aa9e6', count:13, title:'Companion deck'}, {icon:'dungeon', color:'#9d8fc2', count:24, title:'Dungeon deck'}, {icon:'little', color:'#8fd14f', count:8, title:'Little Monster deck'}, {icon:'big', color:'#ff7a59', count:12, title:'Big Monster deck'}],
      legend:[['city','City'],['dungeon','Dungeon'],['little','Little Monster'],['big','Big Monster'],['spades','Rune'],['star','Star rune']].map((l)=> ({icon:l[0], name:l[1]})),
      keyOpen:s.keyOpen, toggleKey:()=> this.setState({keyOpen:!s.keyOpen}),
      showHint:!s.trig && !s.ai && !s.keyOpen, hint:hint,
      trig:!!s.trig, trigIcon:s.trig || 'city', trigTitle:TITLES[s.trig] || '', trigText:TEXT[s.trig] || '', trigBtn:BTN[s.trig] || '',
      ai:s.ai, paces:PACES.map((p)=> ({label:p[0], on:s.pace === p[1], bg:s.pace === p[1] ? '#fff7e6' : 'transparent', pick:()=> this.setState({pace:p[1]})})),
      backToYou:()=> this.setState({ai:false, pos:[1,1], steps:3, trig:null}),
      stats:[{name:'Charisma', icon:'cha', v:2, bg:'#ffd6e0'}, {name:'Strength', icon:'str', v:1, bg:'#ffe0b8'}, {name:'Movement', icon:'mov', v:3, bg:'#d6ecff'}],
      pips:[0,1,2].map((i)=> ({bg:i < s.steps && !s.trig && !s.ai ? '#ff8a3d' : 'transparent'})),
      canExplore:canEx, noExplore:!canEx, exploreWhy:s.steps <= 0 ? 'No steps left' : 'No empty slot touches your hex',
      endTurn:()=>{ if (endOk) this.setState({ai:true, keyOpen:false}); }, endOff:!endOk,
      endBg:endOk ? '#ff8a3d' : '#f3e6c8', endShadow:endOk ? '3px 4px 0 rgba(43,34,51,.16)' : 'none'
    };
  }
}
</script>
</body>
</html>
