<script type="text/x-dc" data-dc-script data-props='{"freeze":{"editor":null},"ko":{"editor":null},"$preview":{"width":1440,"height":900}}'>

const BEATS = { locked: 800, travel: 640, absorb: 600, land: 640, fade: 420 };
const EASE = 'cubic-bezier(0.3, 0.8, 0.4, 1)';
const SETTLE = 'cubic-bezier(0.2, 0.9, 0.3, 1.2)';
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { beat: this.frozen() ? this.props.freeze : 0, pace: 1 }; this.timers = []; }
  frozen() { return this.props.freeze !== undefined && this.props.freeze !== null && this.props.freeze !== ''; }
  componentDidMount() { if (!this.frozen()) this.play(); }
  componentWillUnmount() { this.clear(); }
  clear() { this.timers.forEach((t) => clearTimeout(t)); this.timers = []; }
  play() {
    this.clear();
    this.setState({ beat: 0 });
    const p = this.state.pace;
    let t = 60;
    const at = (ms, beat) => { this.timers.push(setTimeout(() => this.setState({ beat }), ms)); };
    at(t, 1); t += BEATS.locked / p;
    at(t, 2); t += BEATS.travel / p;
    at(t, 3); t += BEATS.absorb / p;
    at(t, 4); t += BEATS.land / p;
    at(t, 5); t += BEATS.fade / p;
    at(t, 6);
  }
  skip() { this.clear(); this.setState({ beat: 5 }); this.timers.push(setTimeout(() => this.setState({ beat: 6 }), BEATS.fade / this.state.pace)); }
  renderVals() {
    const frozen = this.frozen();
    const ko = !!this.props.ko;
    const b = frozen ? Number(this.props.freeze) : this.state.beat;
    const pace = this.state.pace;
    const d = (ms) => Math.round(ms / pace) + 'ms';
    const T = (prop, ms, ease) => (frozen ? 'transition:none;' : `transition:${prop} ${d(ms)} ${ease || EASE};`);
    const on = b >= 1 && b <= 4;
    // What the engine reported, before and after (sample numbers for the drawing).
    const lanes = {
      you: { hit: 2, shield: 1, through: 1, before: ko ? 1 : 6, after: ko ? 0 : 5 },   // you hit the Opponent
      opp: { hit: 1, shield: 1, through: 0, before: 5, after: 5 },                        // the Opponent hits you
    };
    const absorbed = (l) => Math.max(0, Math.min(l.shield, l.hit - l.through));
    const segs = (target) => Array.from({ length: 7 }, (_, i) => {
      const lost = i >= target.after && i < target.before;
      const full = i < target.after || (lost && b < 4);
      const fall = lost && b >= 4;
      const bg = full || fall ? 'background:#FFD23F;box-shadow:inset 0 -8px 0 rgba(255,90,31,.6);' : 'background:#2a0f0c;';
      const tf = fall ? `transform:skewX(-12deg) translateY(90px) rotate(${i % 2 ? 28 : -22}deg);opacity:0;` : 'transform:skewX(-12deg);opacity:1;';
      const tr = frozen ? 'transition:none;' : `transition:transform ${d(BEATS.land)} ${EASE} ${d((i - target.after) * 90)},opacity ${d(BEATS.land)} linear ${d((i - target.after) * 90 + 200)};`;
      return { style: bg + tf + tr };
    });
    // Your hit travels right toward the Opponent's shield; theirs travels left toward yours.
    const tok = (l, from, to, into) => {
      let x = from, s = 0, rot = 0, op = 1;
      if (b === 1) { x = from; s = 1; }
      if (b === 2) { x = to; s = 1; rot = 360; }
      if (b === 3) { x = to; s = l.hit ? 0.55 + 0.45 * (l.through / l.hit) : 0.4; rot = 360; }
      if (b >= 4) { x = l.through > 0 ? into : to; s = l.through > 0 ? 1.4 : 0.1; rot = 360; op = 0; }
      if (b === 0 || b >= 5) { s = 0; op = 0; }
      return `transform:translateX(${x}px) scale(${s}) rotate(${rot}deg);opacity:${op};` +
        (frozen ? 'transition:none;' : `transition:transform ${d(b === 1 ? 300 : b === 2 ? BEATS.travel : 280)} ${b === 1 ? SETTLE : EASE},opacity ${d(200)} linear;`);
    };
    const shieldStyle = (l) => {
      const flare = b === 3 && absorbed(l) > 0;
      const blocked = b === 4 && l.through === 0 && l.hit > 0;
      const y = on ? 0 : 420;
      return `transform:translateY(${y}px) skewX(-8deg) scale(${flare ? 1.18 : blocked ? 1.1 : 1});filter:brightness(${flare ? 1.4 : 1});` + T('transform', flare ? 180 : 360, SETTLE);
    };
    const blockStyle = (l) => {
      const show = b >= 3 && b <= 4 && absorbed(l) > 0;
      return `transform:skewX(-10deg) translateY(${show ? 0 : -60}px) scale(${show ? 1 : 0});` + T('transform', 280, SETTLE);
    };
    const hitStyle = (l) => {
      const show = b === 4 && l.through > 0;
      return `transform:scale(${show ? 1 : 0}) rotate(${show ? 0 : -40}deg);` + T('transform', 300, SETTLE);
    };
    const stampStyle = (l) => {
      const show = b === 4 && l.through === 0 && l.hit > 0;
      return `transform:rotate(-10deg) scale(${show ? 1 : 2.4});opacity:${show ? 1 : 0};` + T('transform', 220, EASE).replace(';', ',opacity ' + d(120) + ' linear;');
    };
    const shake = (l) => (!frozen && b === 4 && l.through > 0 ? `animation:ff-shake ${d(420)} 1;` : '');
    const caption = {
      0: '', 1: 'Round 4 strike. Both hits land at the same time.', 2: 'The hits travel.',
      3: 'The Opponent blocks 1 of your 2. You block their 1.',
      4: ko ? 'The Opponent is out. The result panel takes over.' : '1 gets through: the Opponent drops to 5. Nothing gets through to you.',
      5: 'Both played rows sweep into the discards.', 6: 'The table is back.',
    }[b];
    const paceBtn = (v, t) => ({ label: t, press: () => { this.setState({ pace: v }); }, style: pace === v ? 'background:#FFD23F;color:#111;' : 'background:transparent;color:#f4efe6;', pressed: pace === v ? 'true' : 'false' });
    return {
      bare: frozen, showTable: !frozen && b < 6,
      scrimStyle: `opacity:${on ? 1 : 0};` + T('opacity', b >= 5 ? BEATS.fade : 240, 'linear'),
      bannerStyle: `transform:translateX(${on ? 0 : -1500}px) skewX(-12deg);` + T('transform', 420, SETTLE),
      youPlateStyle: `transform:translateX(${on ? 0 : -700}px);` + T('transform', 420, SETTLE) + shake(lanes.opp),
      oppPlateStyle: `transform:translateX(${on ? 0 : 700}px);` + T('transform', 420, SETTLE) + shake(lanes.you),
      youSegs: segs(lanes.opp), oppSegs: segs(lanes.you),
      youStam: b >= 4 ? lanes.opp.after : lanes.opp.before,
      oppStam: b >= 4 ? lanes.you.after : lanes.you.before,
      youNumStyle: `transform:scale(${b === 4 && lanes.opp.through > 0 ? 1.25 : 1});` + T('transform', 240, SETTLE),
      oppNumStyle: `transform:scale(${b === 4 && lanes.you.through > 0 ? 1.25 : 1});color:${b >= 4 && lanes.you.through > 0 ? '#ff5646' : '#FFD23F'};` + T('transform', 240, SETTLE),
      youDef: lanes.opp.shield, oppDef: lanes.you.shield,
      youShieldStyle: shieldStyle(lanes.opp), oppShieldStyle: shieldStyle(lanes.you),
      youTokStyle: tok(lanes.you, 574, 790, 1100), youTokNum: b <= 2 ? lanes.you.hit : lanes.you.through,
      oppTokStyle: tok(lanes.opp, 790, 574, 200), oppTokNum: b <= 2 ? lanes.opp.hit : lanes.opp.through,
      youBlockStyle: blockStyle(lanes.opp), youAbsorbed: absorbed(lanes.opp),
      oppBlockStyle: blockStyle(lanes.you), oppAbsorbed: absorbed(lanes.you),
      youHitStyle: hitStyle(lanes.opp), youHitText: '-' + lanes.opp.through, youStampStyle: stampStyle(lanes.opp),
      oppHitStyle: hitStyle(lanes.you), oppHitText: '-' + lanes.you.through, oppStampStyle: stampStyle(lanes.you),
      sparkStyle: `transform:scale(${b === 2 ? 1 : 0});` + (frozen ? 'transition:none;' : `transition:transform ${d(200)} ${SETTLE} ${b === 2 ? d(BEATS.travel * 0.45) : '0ms'};`),
      koStyle: `transform:rotate(-8deg) scale(${ko && b === 4 ? 1 : 3});opacity:${ko && b === 4 ? 1 : 0};` + T('transform', 260, EASE),
      caption, showCaption: b >= 1 && b <= 5,
      showControls: !frozen, done: b === 6, playing: b < 6,
      paceBtns: [paceBtn(0.5, '½×'), paceBtn(1, '1×'), paceBtn(2, '2×')],
      skip: () => this.skip(), replay: () => this.play(),
    };
  }
}

</script>
