<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word Debauchee, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.tile{box-sizing:border-box;width:36px;height:40px;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#1c1a17;border:1px solid #e0d6c3;border-bottom:3px solid #c9bda6;border-radius:6px;font:700 20px 'Bricolage Grotesque',sans-serif;flex:none}
.tile.lay{background:#1f4d3a;color:#f7f1e6;border-color:#1f4d3a;border-bottom-color:#163a2b}
.tile.fresh{background:#fbe3d2;color:#7a3a12;border-color:#7a3a12}
.key{position:relative;flex:1 1 0;min-width:0;height:50px;padding:0;border:1px solid #e0d6c3;border-bottom:3px solid #c9bda6;border-radius:6px;background:#fff;color:#1c1a17;font:700 17px 'Bricolage Grotesque',sans-serif}
.key:disabled{background:transparent;color:#655c4d;border-style:dashed;border-bottom-width:1px}
.key span{position:absolute;right:2px;top:1px;font:500 9px 'IBM Plex Mono',monospace;color:#655c4d}
.seat{padding:4px 8px;border-radius:6px;font-size:13px;font-weight:500;background:#dde9e1;color:#1f4d3a;white-space:nowrap}
.seat.you{background:#fbe3d2;color:#7a3a12;box-shadow:0 0 0 2px #e0762b}
.clue{background:#fff;border:1px solid #e0d6c3;border-radius:8px;padding:6px 8px;min-width:0}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #c9bda6;background:#fff;color:#1c1a17;font:600 14px 'IBM Plex Sans',sans-serif}
.btn.go{background:#e0762b;border-color:#e0762b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f1e6; color: #1c1a17; font-family: 'IBM Plex Sans', sans-serif; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 10px">

<div style="display: flex; align-items: center; gap: 8px">
<h1 style="margin: 0; font: 700 20px 'Bricolage Grotesque', sans-serif">Word Debauchee</h1>
<span style="font-size: 12px; font-weight: 600; color: #655c4d; margin-left: auto">Round 6 of 8</span>
</div>

<div style="display: flex; gap: 6px">
<div class="seat">Ann debauchee 5</div>
<div class="seat you">You 4</div>
<div class="seat">Ben 3</div>
<div class="seat">Cat 2</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<div class="clue"><div style="font-size: 11px; font-weight: 600; color: #655c4d">Letters</div><div style="font: 700 17px 'Bricolage Grotesque', sans-serif">5</div></div>
<div class="clue"><div style="font-size: 11px; font-weight: 600; color: #655c4d">Type</div><div style="font: 700 17px 'Bricolage Grotesque', sans-serif">adjective</div></div>
<div class="clue"><div style="font-size: 11px; font-weight: 600; color: #655c4d">Opposite</div><div style="font: 700 17px 'Bricolage Grotesque', sans-serif">sad</div></div>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<div style="display: flex; gap: 4px"><div class="tile lay">P</div><div class="tile lay">A</div></div>
<div style="margin-left: auto; text-align: right">
<div style="font-size: 14px; font-weight: 600">A word pays its length − 2</div>
<div style="font-size: 12px; color: #655c4d">Ann lays down another in 3 turns</div>
</div>
</div>

<div style="flex: 1; background: #efe7d8; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: auto">
<div style="display: flex; align-items: center; gap: 4px; background: #e6efe9; border-radius: 8px; padding: 3px">
<div class="tile">G</div><div class="tile">L</div><div class="tile">A</div><div class="tile fresh">D</div>
<span style="margin-left: auto; font: 500 12px 'IBM Plex Mono', monospace; color: #655c4d; padding-right: 4px">pays 2</span>
</div>
<div style="display: flex; align-items: center; gap: 4px; padding: 3px">
<div class="tile">M</div><div class="tile">E</div><div class="tile">R</div><div class="tile">R</div>
<span style="margin-left: auto; font: 500 12px 'IBM Plex Mono', monospace; color: #655c4d; padding-right: 4px">pays 2</span>
</div>
<div style="display: flex; align-items: center; gap: 4px; padding: 3px">
<div class="tile">G</div><div class="tile">L</div><div class="tile">E</div><div class="tile">E</div>
<span style="margin-left: auto; font: 500 12px 'IBM Plex Mono', monospace; color: #b3261e; padding-right: 4px">no</span>
</div>
</div>

<div style="font-size: 14px">Put D in GLA?</div>
<div style="display: flex; gap: 6px; align-items: center">
<button class="btn go">Place</button>
<button class="btn">Place and Check! GLAD</button>
<button class="btn" style="border-color: transparent; background: transparent; color: #655c4d; font-weight: 500; padding: 0 6px">Undo</button>
</div>

<div style="display: flex; flex-direction: column; gap: 4px" role="group" aria-label="The pool">
<sc-for list="{{keyRows}}" as="kr" hint-placeholder-count="3">
<div style="display: flex; gap: 3px; justify-content: center">
<sc-for list="{{kr.keys}}" as="k" hint-placeholder-count="10">
<button class="key" disabled="{{k.out}}">{{k.l}}<span>{{k.n}}</span></button>
</sc-for>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pool = { A: 10, B: 3, C: 3, D: 5, E: 15, F: 3, G: 2, H: 3, I: 12, J: 2, K: 2, L: 3, M: 2, N: 8, O: 11, P: 2, Q: 2, R: 6, S: 6, T: 9, U: 6, V: 3, W: 3, X: 2, Y: 3, Z: 0 };
    return {
      keyRows: ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'].map((names) => ({
        keys: names.split('').map((l) => ({ l, n: pool[l], out: pool[l] <= 0 })),
      })),
    };
  }
}
</script>
</body>
</html>
