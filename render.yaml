# Render Blueprint for Universe PRODUCTION (launch task T11). Render is for
# production only: staging is the existing ngrok deployment, and there is no
# Render staging environment. Apply this Blueprint only at launch, after the
# staging, browser, security and database checks have passed.
# Nothing here is a secret: every secret is either generated by Render or
# asked for when the Blueprint is first applied (sync: false). Never put a
# real value in this file. See docs/deploy-render.md for the steps.
#
# Three pieces:
# - universe-production: the public web service (API, sockets, built web app).
# - zekel-engine-production: the games engine from xephoid/zekel-games, on
#   Render's private network only, with its sessions in SQLite on a disk.
# - universe-production-db: Postgres for Universe.
#
# Deploys are manual (autoDeployTrigger: "off") while CI is turned off: no
# commit reaches production without someone pressing deploy.

services:
  - type: web
    name: universe-production
    runtime: docker
    dockerfilePath: ./infra/server.Dockerfile
    dockerContext: .
    branch: main
    region: oregon
    plan: starter
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # The production site's own https origin, e.g. https://<service>.onrender.com
      # or the launch domain.
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: universe-production-db
          property: connectionString
      # The engine's private address; the server calls http://<host:port>/mcp.
      - key: ENGINE_HOSTPORT
        fromService:
          type: pserv
          name: zekel-engine-production
          property: hostport
      # The same generated value the engine checks.
      - key: ENGINE_TOKEN
        fromService:
          type: pserv
          name: zekel-engine-production
          envVarKey: MCP_BEARER_TOKEN
      # Encrypts engine host tokens at rest. Generated by Render; never the
      # 64-zero development key.
      - key: SECRET_KEY
        generateValue: true
      # Render's edge writes CF-Connecting-IP on every request and replaces a
      # caller's copy; the per-client limits key on it (SEC-16-F13).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Sign-in mail. Without RESEND_API_KEY the server writes sign-in links
      # to its log (SEC-14-F26), so production must set both.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Site analytics (PostHog project key, phc_...). Empty: off. The host
      # defaults to https://us.i.posthog.com.
      - key: POSTHOG_KEY
        sync: false

  - type: pserv
    name: zekel-engine-production
    runtime: docker
    repo: https://github.com/xephoid/zekel-games
    # The Dockerfile lands on main when the zekel-games pull request that adds
    # it (branch claude/render-staging) is merged.
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    # One instance only: one process may use the SQLite file (a disk also
    # rules out scaling).
    numInstances: 1
    autoDeployTrigger: "off"
    disk:
      name: engine-sessions
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8787"
      - key: MCP_BEARER_TOKEN
        generateValue: true
      # The image already sets these; repeated here so the Blueprint says
      # where the sessions live.
      - key: SESSION_STORE
        value: sqlite
      - key: SESSION_DB_PATH
        value: /var/data/sessions.db

databases:
  - name: universe-production-db
    databaseName: universe
    user: universe
    region: oregon
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    # No connections from outside Render; the web service uses the private
    # connection string.
    ipAllowList: []
